name: UAE E-Scooter PriceUpdate

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call cron endpoint
        run: |
          curl -s -X GET -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ secrets.VERCEL_APP_URL }}/api/cron/update-prices"
